<!DOCTYPE html>
<html>
<head>
    <title>Cyber Security Dashboard</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff9c;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            text-shadow: 0 0 10px #00ff9c;
        }

        textarea {
            width: 60%;
            height: 120px;
            background: black;
            color: #00ff9c;
            border: 1px solid #00ff9c;
            padding: 10px;
            font-size: 16px;
        }

        button {
            background: #00ff9c;
            color: black;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #00ff9c;
        }

        button:hover {
            background: black;
            color: #00ff9c;
            border: 1px solid #00ff9c;
        }

        a {
            color: #00ff9c;
            text-decoration: none;
            display: block;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #00ff9c;
            padding: 30px;
            margin: 40px auto;
            width: 70%;
            box-shadow: 0 0 20px #00ff9c;
        }
    </style>
</head>

<body>

    <h1>🔐 CYBER SECURITY ANALYZER</h1>

    <div class="box">
        <form method="post" action="/analyze/">
            {% csrf_token %}
            <textarea name="log" placeholder="Paste suspicious log here..."></textarea><br>
            <button type="submit">⚡ Analyze Threat</button>
        </form>

        <a href="/logs/">📊 View Logs</a>
    </div>

</body>
</html>
